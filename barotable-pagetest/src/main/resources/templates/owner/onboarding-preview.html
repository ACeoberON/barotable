<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객 화면 미리보기</title><style>
:root{--ink:#263442;--muted:#738092;--line:#e4e9ef;--soft:#f6f8fa;--blue:#405a78}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font-family:"Noto Sans KR",Arial,sans-serif}.page{max-width:900px;margin:0 auto;padding:34px 22px 60px}.brand{font-weight:800;color:var(--blue);letter-spacing:.08em}.progress{display:flex;gap:7px;margin:24px 0 38px}.progress i{height:4px;flex:1;background:var(--blue);border-radius:8px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,4vw,38px)}h1{font-size:clamp(28px,4vw,36px);letter-spacing:-.04em;margin:0 0 10px}p{color:var(--muted);line-height:1.7}.preview{margin-top:24px;border:1px solid var(--line);border-radius:15px;overflow:hidden}.preview-head{padding:18px 20px;background:#fbfcfd;border-bottom:1px solid var(--line)}.preview-head b{display:block;margin-bottom:5px}.map{min-height:240px;padding:24px;background-color:#fff;background-image:radial-gradient(#e5eaf0 1px,transparent 1px);background-size:18px 18px;display:grid;place-items:center}.map-inner{width:min(560px,100%);min-height:170px;border:1px dashed #b8c5d3;border-radius:12px;display:grid;place-items:center;color:#8996a5;font-size:13px;text-align:center;padding:20px}.summary{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.btn{padding:13px 20px;border-radius:10px;font-weight:700;cursor:pointer}.ghost{background:#fff;border:1px solid var(--line);color:var(--blue)}.primary{background:var(--blue);border:0;color:#fff}@media(max-width:560px){.actions{flex-direction:column-reverse}.btn{width:100%}}
</style>
</head><body data-screen="owner-onboarding-preview" th:data-server="true">
<script src="../../static/js/onboarding-nav.js?v=20261116a" th:src="@{/js/onboarding-nav.js}"></script>
<main class="page"><div class="brand">BAROTABLE</div><div class="progress"><i></i><i></i><i></i><i></i></div><section class="card"><h1>고객에게 보일 매장을 확인해 보세요.</h1><p>배치한 테이블이 고객 예약 화면에서 어떻게 보일지 확인하는 마지막 단계예요. 수정이 필요하면 이전 단계로 돌아갈 수 있습니다.</p><div class="preview"><div class="preview-head"><b id="store-name">내 매장</b><span style="font-size:12px;color:#738092">매장 좌석 선택 미리보기</span></div><div class="map"><div class="map-inner" id="map-message">매장 공간과 테이블 배치가 이 영역에 표시됩니다.<br>좌석도 편집 화면에서 배치를 저장하면 고객 화면에 반영돼요.</div></div><div class="summary"><span id="floor-count">층 1개</span><span id="table-count">테이블 배치 확인 필요</span><span>예약 전 고객에게 표시되는 화면</span></div></div><div class="actions"><button class="btn ghost" id="back">배치 수정하기</button><button class="btn primary" id="finish">설정 완료하기</button></div></section></main><script>
try{const raw=sessionStorage.getItem('bt.floors');if(raw){const fs=JSON.parse(raw);const floors=Array.isArray(fs)?fs:[];const count=floors.reduce((n,f)=>n+(f.tables||[]).length,0);document.getElementById('floor-count').textContent='층 '+floors.length+'개';document.getElementById('table-count').textContent='테이블 '+count+'개';if(count){document.getElementById('map-message').textContent='테이블 '+count+'개가 배치된 매장입니다. 고객 예약 화면에서 좌석을 선택할 수 있어요.'}}}catch(e){};document.getElementById('store-name').textContent=sessionStorage.getItem('baro-new-store-name')||'내 매장';document.getElementById('back').onclick=()=>goOwner('owner-editor');document.getElementById('finish').onclick=()=>{sessionStorage.removeItem('baro-owner-onboarding');localStorage.setItem('baro-owner-onboarding-complete','yes');goOwner('owner-dashboard')};
</script>
</body></html>
