<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바로테이블 · 점주 회원가입</title><style>
:root{--ink:#26374A;--muted:#677570;--line:#e8eaeb;--bg:#fbfcfc;--primary:#405A78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:560px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 8px 30px #26374a0a}h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);line-height:1.6}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;font-size:15px}.btn{width:100%;padding:14px;border:0;border-radius:9px;background:var(--primary);color:white;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}.ghost{background:white;color:var(--primary);border:1px solid var(--line)}small{color:var(--muted)}
</style>
</head><body data-screen="owner-signup" th:data-server="true">
<script src="../../static/js/onboarding-nav.js?v=20261116a" th:src="@{/js/onboarding-nav.js}"></script>
<main class="wrap"><section class="card"><h1>점주 회원가입</h1><p>매장 정보를 등록하고 바로테이블 점주 계정을 만들어 보세요.</p><form id="signup-form"><div class="field"><label for="store">매장명</label><input id="store" required placeholder="매장명을 입력하세요"></div><div class="field"><label for="owner">점주명</label><input id="owner" required placeholder="이름"></div><div class="field"><label for="email">이메일</label><input id="email" type="email" required placeholder="이메일 주소"></div><div class="field"><label for="phone">연락처</label><input id="phone" type="tel" required placeholder="연락처"></div><div class="field"><label for="password">비밀번호</label><input id="password" type="password" minlength="8" required placeholder="8자 이상"></div><div class="field"><label for="password2">비밀번호 확인</label><input id="password2" type="password" minlength="8" required placeholder="비밀번호 재입력"></div><button class="btn" type="submit">가입하고 매장 설정 시작</button><button class="btn ghost" id="back" type="button">로그인으로 돌아가기</button><small>※ 현재 HTML 시연용 화면으로, 실제 회원가입·인증 API는 연결되어 있지 않습니다.</small></form></section></main><script>
document.getElementById('back').onclick=()=>goOwner('owner-login');document.getElementById('signup-form').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('password').value!==document.getElementById('password2').value){alert('비밀번호가 일치하지 않습니다.');return;}localStorage.setItem('baro-owner-has-account','yes');sessionStorage.setItem('baro-owner-onboarding','welcome');sessionStorage.setItem('baro-new-store-name',document.getElementById('store').value);sessionStorage.removeItem('bt.floors');goOwner('owner-onboarding-welcome');});
</script>
</body></html>
