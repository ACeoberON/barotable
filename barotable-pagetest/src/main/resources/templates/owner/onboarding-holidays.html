<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>휴무일 설정</title><style>
:root{--ink:#263442;--muted:#738092;--line:#e4e9ef;--soft:#f6f8fa;--blue:#405a78}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font-family:"Noto Sans KR",Arial,sans-serif}.page{max-width:820px;margin:0 auto;padding:34px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.brand{font-weight:800;color:var(--blue);letter-spacing:.08em}.progress{display:flex;gap:7px;margin:24px 0 38px}.progress i{height:4px;flex:1;background:#e8edf2;border-radius:8px}.progress i:nth-child(-n+2){background:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,4vw,38px);box-shadow:0 12px 40px #26374a09}h1{font-size:clamp(28px,4vw,36px);letter-spacing:-.04em;margin:0 0 10px}p{color:var(--muted);line-height:1.7;margin:0 0 28px}.section{padding:22px 0;border-top:1px solid var(--line)}h2{font-size:16px;margin:0 0 6px}.hint{font-size:12px;color:var(--muted);margin-bottom:16px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{position:relative}.day input{position:absolute;opacity:0}.day label{display:grid;place-items:center;min-height:54px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:650}.day input:checked+label{background:#edf2f7;border-color:var(--blue);color:var(--blue)}.date-row{display:flex;gap:9px;flex-wrap:wrap}.date-row input{border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.date-row input[type=date]{min-width:180px}.date-row input[type=text]{flex:1;min-width:160px}.ghost,.primary{border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer}.ghost{border:1px solid var(--line);background:#fff;color:var(--blue)}.primary{border:0;background:var(--blue);color:#fff}.holidays{display:grid;gap:8px;margin-top:14px}.holiday{display:flex;justify-content:space-between;align-items:center;background:var(--soft);padding:11px 13px;border-radius:10px;font-size:13px}.holiday button{border:0;background:transparent;color:#7c8794;cursor:pointer}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.footer button{min-width:130px}@media(max-width:560px){.days{gap:5px}.day label{min-height:46px;font-size:13px}.footer{flex-direction:column-reverse}.footer button{width:100%}}
</style>
</head><body data-screen="owner-onboarding-holidays" th:data-server="true">
<script src="../../static/js/onboarding-nav.js?v=20261116a" th:src="@{/js/onboarding-nav.js}"></script>
<main class="page"><div class="top"><span class="brand">BAROTABLE</span><span>STEP 01 / 03</span></div><div class="progress"><i></i><i></i><i></i><i></i></div><section class="card"><h1>매장의 쉬는 날을 알려주세요.</h1><p>휴무일에는 고객이 예약할 수 없도록 설정할 수 있어요. 나중에 운영 조건 메뉴에서 언제든 변경할 수 있습니다.</p><div class="section"><h2>매주 정기 휴무</h2><div class="hint">매주 반복되는 요일을 선택해 주세요. 쉬는 날이 없다면 선택하지 않아도 됩니다.</div><div class="days" id="days">일 월 화 수 목 금 토</div></div><div class="section"><h2>특정 날짜 휴무</h2><div class="hint">명절이나 개인 사정 등 특정 날짜에만 쉬는 날을 추가해 주세요.</div><div class="date-row"><input id="date" type="date"><input id="reason" type="text" placeholder="휴무 사유 (선택)"><button class="ghost" id="add" type="button">날짜 추가</button></div><div class="holidays" id="holidays"></div></div><div class="footer"><button class="ghost" id="back" type="button">이전</button><button class="primary" id="next" type="button">저장하고 다음</button></div></section></main><script>
const days=['일','월','화','수','목','금','토'];const host=document.getElementById('days');host.innerHTML=days.map((d,i)=>`<div class="day"><input id="d${i}" type="checkbox" value="${i}"><label for="d${i}">${d}</label></div>`).join('');let data={weekly:[],dates:[]};try{data=JSON.parse(sessionStorage.getItem('baro-holidays')||'{"weekly":[],"dates":[]}')}catch(e){};days.forEach((d,i)=>document.getElementById('d'+i).checked=data.weekly.includes(i));const list=document.getElementById('holidays');function draw(){list.innerHTML='';data.dates.forEach((v,i)=>{const row=document.createElement('div');row.className='holiday';const txt=document.createElement('span');txt.textContent=v.date+(v.reason?' · '+v.reason:'');const del=document.createElement('button');del.textContent='삭제';del.onclick=()=>{data.dates.splice(i,1);draw()};row.append(txt,del);list.append(row)})}draw();document.getElementById('add').onclick=()=>{const date=document.getElementById('date').value;if(!date){alert('날짜를 선택해 주세요.');return}if(!data.dates.some(x=>x.date===date))data.dates.push({date,reason:document.getElementById('reason').value.trim()});document.getElementById('date').value='';document.getElementById('reason').value='';draw()};document.getElementById('back').onclick=()=>goOwner('owner-onboarding-welcome');document.getElementById('next').onclick=()=>{data.weekly=[...document.querySelectorAll('#days input:checked')].map(x=>Number(x.value));sessionStorage.setItem('baro-holidays',JSON.stringify(data));sessionStorage.setItem('baro-owner-onboarding','layout');goOwner('owner-editor')};
</script>
</body></html>
