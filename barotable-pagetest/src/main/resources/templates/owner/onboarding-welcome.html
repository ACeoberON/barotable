<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매장 운영 시작하기</title><style>
:root{--ink:#263442;--muted:#738092;--line:#e4e9ef;--soft:#f6f8fa;--blue:#405a78}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font-family:"Noto Sans KR",Arial,sans-serif}.page{min-height:100vh;display:grid;place-items:center;padding:28px}.panel{width:min(760px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(28px,6vw,58px);box-shadow:0 18px 50px #26374a0c}.brand{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--blue)}.eyebrow{margin-top:54px;color:var(--blue);font-size:13px;font-weight:750}.progress{display:flex;gap:7px;margin:14px 0 36px}.progress i{height:4px;flex:1;background:#e8edf2;border-radius:8px}.progress i:first-child{background:var(--blue)}h1{font-size:clamp(30px,5vw,44px);line-height:1.25;letter-spacing:-.04em;margin:0 0 16px}p{color:var(--muted);line-height:1.8;margin:0}.intro{font-size:16px;max-width:540px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:36px 0}.step{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px}.step b{display:block;font-size:14px;margin-bottom:7px}.step span{font-size:12px;color:var(--muted);line-height:1.6}.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:36px}.btn{border:0;border-radius:11px;padding:15px 24px;background:var(--blue);color:#fff;font-weight:750;font-size:15px;cursor:pointer}.sub{font-size:12px;color:var(--muted)}@media(max-width:560px){.steps{grid-template-columns:1fr}.eyebrow{margin-top:36px}.actions{align-items:stretch;flex-direction:column-reverse}.btn{width:100%}}
</style>
</head><body data-screen="owner-onboarding-welcome" th:data-server="true">
<script src="../../static/js/onboarding-nav.js?v=20261124a" th:src="@{/js/onboarding-nav.js}"></script>
<main class="page"><section class="panel"><div class="brand">BAROTABLE</div><div class="eyebrow">점주 첫 설정 · 시작하기</div><div class="progress"><i></i><i></i><i></i><i></i></div><h1>매장 운영을<br>시작해 볼까요?</h1><p class="intro">처음이라도 괜찮아요. 매장에 필요한 내용을 하나씩 설정하면 바로 예약 관리를 시작할 수 있어요.</p><div class="steps"><div class="step"><b>01. 쉬는 날 설정</b><span>매주 정기 휴무와 특별 휴무일을 지정해요.</span></div><div class="step"><b>02. 매장 공간 구성</b><span>층과 작업 영역을 만들고 테이블을 배치해요.</span></div><div class="step"><b>03. 고객 화면 확인</b><span>고객에게 보이는 예약 화면을 미리 확인해요.</span></div></div><div class="actions"><span class="sub">설정은 언제든 운영 메뉴에서 변경할 수 있어요.</span><button class="btn" id="start">설정 시작하기</button></div></section></main><script>
document.getElementById('start').addEventListener('click',()=>{sessionStorage.setItem('baro-owner-onboarding','layout');sessionStorage.removeItem('bt.floors');goOwner('owner-onboarding-holidays');});
</script>
</body></html>
